[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airflow-provider-openfeature"
version = "0.1.0"
description = "Airflow-native OpenFeature integration: evaluate feature flags and run progressive delivery against any backend."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "1fanwang", email = "1fannnw@gmail.com" }]
keywords = ["airflow", "airflow-provider", "openfeature", "feature-flags", "progressive-delivery", "canary"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "apache-airflow>=2.9.0",
    "apache-airflow-providers-common-compat>=1.3.0",
    "openfeature-sdk>=0.7.0",
]

[project.optional-dependencies]
flagd = ["openfeature-provider-flagd>=0.1.0"]
growthbook = ["growthbook>=1.0.0"]
unleash = ["UnleashClient>=5.0.0"]
statsig = ["statsig>=0.40.0"]
dev = ["pytest>=7.0", "growthbook>=1.0.0", "statsig>=0.40.0", "UnleashClient>=5.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs external backends/docker; run with RUN_INTEGRATION=1"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

# Airflow auto-discovers all three surfaces from these entry points.
[project.entry-points."apache_airflow_provider"]
provider_info = "openfeature_airflow.provider_info:get_provider_info"

[project.entry-points."airflow.policy"]
openfeature = "openfeature_airflow.policy"

[project.entry-points."airflow.plugins"]
openfeature = "openfeature_airflow.plugin:OpenFeaturePlugin"

[project.urls]
Homepage = "https://github.com/1fanwang/airflow-provider-openfeature"
Source = "https://github.com/1fanwang/airflow-provider-openfeature"
"Bug Tracker" = "https://github.com/1fanwang/airflow-provider-openfeature/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/openfeature_airflow"]

[tool.hatch.build.targets.sdist]
include = ["src/openfeature_airflow", "example_dags", "tests", "README.md", "LICENSE"]
