name: Bug report
description: Something isn't working as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Provider, Apache Airflow, Python, and the backend/provider in use
      placeholder: provider 0.1.0, Airflow 3.3.0, Python 3.11, flagd 0.5.1
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Minimal steps, a DAG snippet, and the flag config if relevant
  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      render: shell
