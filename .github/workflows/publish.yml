name: Publish to PyPI

# The single place that builds, signs, and ships a release to PyPI. Two entry points:
#   - Automated: release-please.yml dispatches this workflow after it creates a release tag (a tag
#     pushed by the Actions token can't trigger a `push: tags` run, so it hands off via workflow_dispatch).
#   - Manual: a hand-cut "vX.Y.Z" tag pushed by a person, or a re-publish of an existing tag from the
#     Actions tab. PyPI trusted publishing is registered for THIS workflow file, so all publishing
#     routes through here to keep one OIDC publisher identity.
on:
  push:
    tags:
      - "v[0-9]*"
      - "*-v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, sign, and publish (e.g. airflow-provider-openfeature-v0.2.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write  # create or update the GitHub Release and upload signed assets
      id-token: write  # trusted publishing (OIDC) + keyless Sigstore signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install build==1.5.0
      - run: python -m build
      - name: Publish to PyPI with attestations (PEP 740)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
      - name: Sign the artifacts with Sigstore (keyless, via OIDC)
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
      - name: Attach the signed assets to the release (create it if a hand-cut tag has none)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            out=$(gh release upload "$TAG" dist/*.tar.gz dist/*.whl dist/*.sigstore* --clobber 2>&1) || {
              echo "$out"
              echo "$out" | grep -qi immutable || exit 1  # tolerate only the immutable-release case
              echo "note: release is immutable; PyPI attestations provide provenance"
            }
          else
            gh release create "$TAG" dist/*.tar.gz dist/*.whl dist/*.sigstore* --title "$TAG" --generate-notes
          fi
