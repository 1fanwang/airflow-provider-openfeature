name: Publish to PyPI

# Automated releases publish from the release-please workflow (a tag pushed by the Actions token does
# not start a tag-triggered run). This workflow covers the other two cases: a hand-cut "vX.Y.Z" tag
# pushed by a person, and a manual re-publish of an existing tag via the Actions tab.
on:
  push:
    tags:
      - "v[0-9]*"
      - "*-v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, sign, and publish (e.g. airflow-provider-openfeature-v0.2.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write  # create or update the GitHub Release and upload signed assets
      id-token: write  # trusted publishing (OIDC) + keyless Sigstore signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install build==1.5.0
      - run: python -m build
      - name: Publish to PyPI with attestations (PEP 740)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          attestations: true
      - name: Sign the artifacts with Sigstore (keyless, via OIDC)
        uses: sigstore/gh-action-sigstore-python@f514d46b907ebcd5bedc05145c03b69c1edd8b46 # v3.0.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
      - name: Attach the signed assets to the release (create it if a hand-cut tag has none)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/*.whl dist/*.sigstore* --clobber \
              || echo "note: could not attach assets (immutable release); PyPI attestations provide provenance"
          else
            gh release create "$TAG" dist/*.tar.gz dist/*.whl dist/*.sigstore* --title "$TAG" --generate-notes
          fi
