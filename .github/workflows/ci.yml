name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC for tokenless Codecov upload on a public repo
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        airflow-version: ["2.11.0", "3.3.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Airflow (with constraints) + the provider
        run: |
          python -m pip install --upgrade pip
          pip install "apache-airflow==${{ matrix.airflow-version }}" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${{ matrix.airflow-version }}/constraints-${{ matrix.python-version }}.txt"
          pip install -e ".[dev,growthbook]"
      - name: Run unit tests
        run: pytest tests/ -q -m "not integration" --cov=openfeature_airflow --cov-branch --cov-report=xml --cov-fail-under=95
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: py${{ matrix.python-version }}-af${{ matrix.airflow-version }}
      - name: Run example-DAG e2e (airflow dags test, real execution)
        run: python system_tests/verify_examples_e2e.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Assert wheel does not ship the airflow namespace
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(whl).namelist()
          assert not any(n.startswith("airflow/") for n in names), "wheel ships airflow/ namespace!"
          print("wheel namespace ok:", whl)
          PY

  # Single required status check for branch protection.
  # Add "ci-success" as the only required check under Settings → Branches → main.
  # This job fails (or is absent) whenever any job in the matrix, lint, or build fails or is skipped.
  ci-success:
    needs: [test, lint, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All CI jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more required jobs failed, were cancelled, or were skipped."
            exit 1
          fi
          echo "All required jobs passed."
