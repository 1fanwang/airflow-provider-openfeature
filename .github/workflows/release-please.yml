name: release-please

# Autonomous releases: release-please watches conventional commits on main and keeps a release PR
# open with the next version bump and changelog. Merging that PR creates the tag and GitHub Release,
# then the job below hands off to publish.yml to sign and ship the build to PyPI.
#
# Why dispatch publish.yml instead of publishing here directly:
#   1. A tag pushed by the Actions token does not start a tag-triggered workflow run (GitHub
#      suppresses that), so publish.yml's `push: tags` trigger never fires for a release-please tag.
#      workflow_dispatch is the documented exception — it fires even when triggered by GITHUB_TOKEN.
#   2. PyPI trusted publishing binds the OIDC identity to a single workflow filename. It is registered
#      for publish.yml; publishing from release-please.yml is rejected as `invalid-publisher`. Routing
#      through publish.yml keeps one registered publisher and one copy of the build/sign/upload steps.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write  # dispatch publish.yml (workflow_dispatch fires even from GITHUB_TOKEN)
    steps:
      - name: Dispatch publish.yml to build, sign, and ship the new tag to PyPI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml -R "${{ github.repository }}" -f tag="${{ needs.release-please.outputs.tag_name }}"
