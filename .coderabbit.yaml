# CodeRabbit config — https://docs.coderabbit.ai/getting-started/configure-coderabbit
# Requires the CodeRabbit GitHub App: https://github.com/marketplace/coderabbitai
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!**/*.svg"
    - "!**/*.gif"
    - "!**/*.png"
    - "!docs/demo*"
  tools:
    ruff:
      enabled: true
chat:
  auto_reply: true
